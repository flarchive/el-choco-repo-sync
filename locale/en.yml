el-choco-repo-sync:
  admin:
    description: "Keep GitHub documentation current and announce releases in existing discussions."
    scheduler_help: "Run the Flarum scheduler every minute, or process jobs manually here. Automation is initially disabled."
    connection: "Connection and publishing user"
    enabled: "Enable Repo Sync"
    actor: "Flarum user ID for edits and replies"
    actor_help: "This user needs permission to view the discussion, edit its first post and post replies. A dedicated bot user can be used. No additional permissions are granted."
    webhook: "GitHub webhook URL"
    secret: "Shared webhook secret"
    secret_saved: "Saved — leave blank to keep"
    secret_needed: "At least 32 characters"
    generate: "Generate secure secret"
    generated_secret: "New secret — copy before saving"
    secret_help: "Copy the generated secret before saving and enter it in GitHub’s Secret field. Use the URL above, application/json, and the Pushes and Releases events. Saved secrets are not displayed again."
    token: "GitHub token (optional)"
    token_saved: "Saved — leave blank to keep"
    token_optional: "Not required for public repositories"
    clear_token: "Remove saved GitHub token on save"
    token_help: "Optional for higher API limits or private repositories. For a fine-grained token, grant only Contents: Read on the required repositories. Private README content becomes visible according to the target discussion’s read permissions."
    new_mapping: "New mapping"
    mapping_enabled: "Enable this mapping"
    repo: "GitHub repository (owner/name)"
    branch: "Branch"
    file: "README file within the repository"
    discussion: "Discussion ID"
    post: "First post ID"
    ids_help: "Enter numeric IDs. Discussion IDs and post IDs differ: find the post ID in the discussion API response under firstPost. The target must be that discussion’s first post."
    readme: "Update README on pushes to this branch"
    mode: "First post update mode"
    mode_section: "Replace marked README section only"
    mode_whole: "Replace entire first post"
    section_help: "Personal introductions and text outside the markers are preserved. Markers are invisible in the rendered post. Insert them yourself or initialize the section once using the button below."
    whole_help: "Warning: each synchronization replaces all first-post content with the README. A backup is created first."
    marker_content: "The README will appear here."
    releases: "Reply with release notes when releases are published"
    prereleases: "Also announce prereleases"
    sync: "Queue README synchronization"
    initialize: "Initialize README section and synchronize"
    initialize_confirm: "If markers are missing, a README section will be appended to the existing text. A backup is created before editing. Continue?"
    add: "Add repository"
    remove: "Remove mapping"
    save: "Save changes"
    unsaved: "Save your changes first."
    jobs: "Recent jobs"
    refresh: "Refresh status"
    run: "Process up to two jobs now"
    retry: "Queue again"
    no_jobs: "No jobs yet."
    backups: "Post backups"
    backup_help: "The last ten backups per mapping are retained. To restore, open and copy a backup, then paste it into the first post manually. Only administrators can access backups."
    no_backups: "No backups yet."
    backup_content: "Backed-up post content"
    saved: "Settings saved."
    processed: "Processing finished. See individual jobs for results."
    queued: "Job queued. It will run through the scheduler or manual processing."
    loading: "Loading…"
    status_pending: "Pending"
    status_processing: "Processing"
    status_done: "Done"
    status_error: "Error"
    status_ignored: "Skipped"
    resolve: "Find first post from discussion ID"
    errors:
      invalid_config: "Invalid configuration. Complete enabled mappings, use numeric IDs and a secret of at least 32 characters."
      duplicate_target: "A first post may belong to only one enabled mapping."
      actor_missing: "Publishing user missing or not found."
      github_not_found: "Repository, branch, file or release not found on GitHub. Also check token permissions."
      github_rate_limit: "GitHub rate limit reached or access denied. Check token and permissions; transient errors are retried."
      github_failed: "Could not read GitHub data."
      publish_failed: "Flarum could not save the post. Check permissions, locks, formatting and post length."
      permission_denied: "The publishing user lacks required permissions."
      markers_missing: "README markers are missing, reversed or duplicated. Initialize the section once or correct the markers."
      reserved_markers: "The README itself contains reserved REPOSYNC markers."
      empty_readme: "README is empty; the post was not changed."
      not_configured: "Repo Sync is disabled or not fully configured."
      invalid_signature: "Invalid webhook signature."
      invalid_payload: "Invalid webhook payload."
      mapping_disabled: "Mapping removed, changed or disabled."
      release_skipped: "Draft, unpublished release or excluded prerelease."
      target_invalid: "Target missing, hidden or not the first post of the configured discussion."
      too_large: "Content too large. Maximum README: 50 KB; resulting post: 60 KB."
      internal_error: "Processing failed. Check the Flarum environment if this persists."
      request_failed: "Request failed. Check your connection and administrator session."
      not_found: "Backup not found."
      unchanged: "README unchanged; no edit made."
      updated: "README updated."
      replied: "Release reply published."
